# Local testing stack for the SOT Portal.
#
# The API (with the React SPA bundled into it) runs in Docker and talks to a
# SQL Server you run yourself on the host and manage in SSMS. Only outbound
# email is faked — MailHog captures it so you can read every notification.
#
# Mirrors the office deployment shape:
#   - App hosted under the /SOT sub-path (App__PathBase=/SOT, SPA built for /SOT/)
#   - Single origin: one container serves both the API and the React SPA
#   - Database "SOT", code-first migrations applied on boot
#
# Database: a SQL container (Azure SQL Edge, arm64-native) is bundled below as the
# `sqlserver` service, so the stack is fully self-contained — no host SQL needed.
# DbInitializer creates the SOT database + schema and seeds the elevated account on
# first boot (it retries the connection for ~2 minutes while SQL Edge warms up).
#
# To use your OWN host SQL Server instead, create a `.env` (see .env.example) with
# DB_HOST=host.docker.internal (and DB_PORT/DB_NAME/DB_USER/DB_PASSWORD as needed);
# the bundled `sqlserver` service can then be left stopped.
#
# Run:   docker compose up --build
# Open:  http://localhost:8080/SOT      (login pardeep.sharma@andritz.com / LocalDev@1234)
# Mail:  http://localhost:8025          (MailHog inbox — every notification lands here)

services:
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
      args:
        # Build the SPA for the /SOT sub-path so assets emit under /SOT/assets/*.
        VITE_BASE_PATH: /SOT/
    ports:
      - "8080:8080"
    extra_hosts:
      # Lets the container reach the host's SQL Server as host.docker.internal.
      # Automatic on Docker Desktop; this line makes it work on Linux engines too.
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailhog
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      PORT: "8080"
      # Sub-path hosting, matching the client's IIS sub-app.
      App__PathBase: "/SOT"
      PortalUrl: "http://localhost:8080/SOT"
      # SQL auth against the SQL Server running on YOUR host (managed in SSMS).
      # DbInitializer creates the SOT database + schema and seeds the elevated
      # account on first boot (it retries the connection for ~2 minutes).
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-sqlserver},${DB_PORT:-1433};Database=${DB_NAME:-SOT};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-LocalDev@1234};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Seed__DefaultAdminPassword: "LocalDev@1234"
      JwtSettings__SecretKey: "Local-Only-Change-Me-Min-32-Chars-Secret-Key-123456"
      JwtSettings__Issuer: "AndritzVendorPortal"
      JwtSettings__Audience: "AndritzVendorPortalClient"
      JwtSettings__ExpiryHours: "8"
      # Capture all outbound mail in MailHog (SMTP 1025) instead of the office relay.
      EmailSettings__Host: "mailhog"
      EmailSettings__Port: "1025"
      EmailSettings__EnableSsl: "false"
      EmailSettings__Username: ""
      EmailSettings__Password: ""
      EmailSettings__FromEmail: "local-noreply@andritz.com"
      EmailSettings__FromName: "Andritz Supplier Connect"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"           # web UI
      - "1025:1025"           # SMTP (referenced by the api service as mailhog:1025)

  # Bundled database so the stack is self-contained. Azure SQL Edge runs natively
  # on Apple Silicon (arm64) and amd64; it speaks the same TDS protocol as SQL
  # Server, so the EF Core SqlServer provider + migrations work unchanged.
  # Inspect it from the host with Azure Data Studio at  localhost,1433  (sa / LocalDev@1234).
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    cap_add:
      - SYS_PTRACE
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-LocalDev@1234}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sot_sqldata:/var/opt/mssql

volumes:
  sot_sqldata:
